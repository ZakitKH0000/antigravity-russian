name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package
        shell: powershell
        run: ./Package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AntigravityRussian-win-x64
          path: dist/*
